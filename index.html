<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中州高级中学 · 校园表白墙</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #fff5f7; color: #333; min-height: 100vh; }
  header { background: linear-gradient(135deg, #ff5e7a, #ff8a5c); color: #fff; text-align: center; padding: 28px 16px 22px; }
  header h1 { font-size: 26px; letter-spacing: 2px; }
  header p { font-size: 13px; opacity: .92; margin-top: 6px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(255, 94, 122, .12); padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .seg { display: flex; border: 1.5px solid #ff5e7a; border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: #fff; color: #ff5e7a; font-size: 14px; padding: 7px 16px; cursor: pointer; }
  .seg button.on { background: #ff5e7a; color: #fff; }
  input[type=text], textarea { width: 100%; border: 1.5px solid #ffd3dc; border-radius: 10px; padding: 10px 12px; font-size: 15px; outline: none; font-family: inherit; }
  input[type=text]:focus, textarea:focus { border-color: #ff5e7a; }
  textarea { min-height: 84px; resize: vertical; }
  .hint { font-size: 12px; color: #999; }
  .filelabel { display: inline-block; background: #fff0f3; color: #ff5e7a; border: 1.5px dashed #ffb3c1; border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .filelabel input { display: none; }
  #fileName { font-size: 13px; color: #666; }
  .submit { width: 100%; border: 0; background: linear-gradient(135deg, #ff5e7a, #ff8a5c); color: #fff; font-size: 16px; font-weight: bold; padding: 12px; border-radius: 999px; cursor: pointer; margin-top: 4px; }
  .submit:disabled { opacity: .6; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 12px; }
  .toolbar h2 { font-size: 16px; }
  .toolbar button { border: 0; background: none; color: #ff5e7a; font-size: 14px; cursor: pointer; }
  .post { background: #fff; border-radius: 14px; box-shadow: 0 2px 10px rgba(255, 94, 122, .10); padding: 16px; margin-bottom: 14px; }
  .post .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .post .who { font-weight: bold; font-size: 15px; color: #ff5e7a; }
  .post .who.anon { color: #999; }
  .post .time { font-size: 12px; color: #aaa; }
  .post .text { font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .post img { width: 100%; border-radius: 10px; margin-top: 10px; display: block; }
  .post .actions { margin-top: 12px; display: flex; gap: 10px; }
  .like { border: 1.5px solid #ffd3dc; background: #fff; color: #ff5e7a; border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
  .like.liked { background: #ff5e7a; color: #fff; border-color: #ff5e7a; }
  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 30px 0; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; display: none; z-index: 99; white-space: nowrap; }
  footer { text-align: center; font-size: 12px; color: #bbb; padding: 10px 0 30px; }
</style>
</head>
<body>
<header>
  <h1>💌 中州高级中学表白墙</h1>
  <p>匿名或实名，把想说的话留在这里</p>
</header>

<div class="wrap">
  <div class="card">
    <h2>写下你的表白</h2>
    <div class="row">
      <div class="seg">
        <button id="btnAnon" class="on" type="button">匿名</button>
        <button id="btnReal" type="button">实名</button>
      </div>
      <span class="hint" id="modeHint">匿名发帖，不显示你的名字</span>
    </div>
    <div class="row" id="nameRow" style="display:none">
      <input type="text" id="authorName" maxlength="20" placeholder="你的名字（比如：高一三班 小明）">
    </div>
    <div class="row">
      <textarea id="content" maxlength="500" placeholder="想对 TA 说的话……（最多 500 字）"></textarea>
    </div>
    <div class="row">
      <label class="filelabel">📷 上传照片<input type="file" id="photo" accept="image/*"></label>
      <span id="fileName"></span>
    </div>
    <button class="submit" id="submitBtn" type="button">发布表白</button>
  </div>

  <div class="toolbar">
    <h2>💬 表白墙</h2>
    <button id="refreshBtn" type="button">↻ 刷新</button>
  </div>
  <div id="feed"><div class="empty">正在加载表白……</div></div>
  <footer>友善发言，理性表白 · 校园表白墙</footer>
</div>
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL = "https://nfdnprdxzviyiyvuzyyu.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mZG5wcmR4enZpeWl5dnV6eXl1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1NTA1NTEsImV4cCI6MjExMDEyNjU1MX0.eBm_duuT1Z9OuRbNSnVilQCna32ievw0hJcDzz7Q2kU";
var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var isAnon = true;
var deviceId = localStorage.getItem("cb_device_id");
if (!deviceId) { deviceId = "d_" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("cb_device_id", deviceId); }

function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(function(){ t.style.display = "none"; }, 2200);
}
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function timeAgo(ts) {
  var diff = Date.now() - new Date(ts).getTime();
  var m = Math.floor(diff / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return m + "分钟前";
  var h = Math.floor(m / 60);
  if (h < 24) return h + "小时前";
  var d = Math.floor(h / 24);
  if (d < 30) return d + "天前";
  return new Date(ts).toLocaleDateString();
}

document.getElementById("btnAnon").onclick = function() {
  isAnon = true;
  this.classList.add("on"); document.getElementById("btnReal").classList.remove("on");
  document.getElementById("nameRow").style.display = "none";
  document.getElementById("modeHint").textContent = "匿名发帖，不显示你的名字";
};
document.getElementById("btnReal").onclick = function() {
  isAnon = false;
  this.classList.add("on"); document.getElementById("btnAnon").classList.remove("on");
  document.getElementById("nameRow").style.display = "flex";
  document.getElementById("modeHint").textContent = "实名发帖，会显示你的名字";
};
document.getElementById("photo").onchange = function() {
  document.getElementById("fileName").textContent = this.files.length ? this.files[0].name : "";
};

async function loadFeed() {
  var feed = document.getElementById("feed");
  var res = await client.from("confessions").select("*").order("created_at", { ascending: false }).limit(100);
  if (res.error) { feed.innerHTML = '<div class="empty">加载失败，请刷新重试（' + esc(res.error.message) + '）</div>'; return; }
  var posts = res.data || [];
  var likesRes = await client.from("confession_likes").select("confession_id,device_id");
  var likeCount = {}, likedByMe = {};
  (likesRes.data || []).forEach(function(l) {
    likeCount[l.confession_id] = (likeCount[l.confession_id] || 0) + 1;
    if (l.device_id === deviceId) likedByMe[l.confession_id] = true;
  });
  if (!posts.length) { feed.innerHTML = '<div class="empty">墙还是空的，来发第一条表白吧 💌</div>'; return; }
  feed.innerHTML = posts.map(function(p) {
    var who = p.is_anonymous ? "匿名" : esc(p.author_name || "实名同学");
    var whoCls = p.is_anonymous ? "who anon" : "who";
    var img = p.image_url ? '<img src="' + esc(p.image_url) + '" loading="lazy" alt="表白照片">' : "";
    var liked = likedByMe[p.id];
    return '<div class="post">' +
      '<div class="meta"><span class="' + whoCls + '">' + (p.is_anonymous ? "🕶️ " : "👤 ") + who + '</span><span class="time">' + timeAgo(p.created_at) + '</span></div>' +
      '<div class="text">' + esc(p.content) + '</div>' + img +
      '<div class="actions"><button class="like' + (liked ? " liked" : "") + '" data-id="' + p.id + '" ' + (liked ? "disabled" : "") + '>' + (liked ? "❤️ 已点赞" : "🤍 点赞") + ' · ' + (likeCount[p.id] || 0) + '</button></div>' +
      '</div>';
  }).join("");
  feed.querySelectorAll(".like").forEach(function(btn) {
    btn.onclick = async function() {
      var id = btn.getAttribute("data-id");
      btn.disabled = true;
      var r = await client.from("confession_likes").insert({ confession_id: id, device_id: deviceId });
      if (r.error) { toast("点赞失败，请重试"); btn.disabled = false; return; }
      loadFeed();
    };
  });
}

document.getElementById("refreshBtn").onclick = loadFeed;

document.getElementById("submitBtn").onclick = async function() {
  var btn = this;
  var content = document.getElementById("content").value.trim();
  if (!content) { toast("先写点表白内容吧"); return; }
  var name = isAnon ? null : (document.getElementById("authorName").value.trim() || "实名同学");
  var file = document.getElementById("photo").files[0];
  btn.disabled = true; btn.textContent = "发布中…";
  try {
    var imageUrl = null;
    if (file) {
      var path = Date.now() + "_" + Math.random().toString(36).slice(2) + "_" + file.name.replace(/[^\w.\-]+/g, "_");
      var up = await client.storage.from("confession-images").upload(path, file);
      if (up.error) throw new Error("照片上传失败：" + up.error.message);
      imageUrl = client.storage.from("confession-images").getPublicUrl(path).data.publicUrl;
    }
    var ins = await client.from("confessions").insert({
      content: content, image_url: imageUrl, author_name: name, is_anonymous: isAnon
    });
    if (ins.error) throw new Error("发布失败：" + ins.error.message);
    document.getElementById("content").value = "";
    document.getElementById("photo").value = "";
    document.getElementById("fileName").textContent = "";
    toast("发布成功 💌");
    loadFeed();
  } catch (e) {
    toast(e.message || "发布失败，请重试");
  }
  btn.disabled = false; btn.textContent = "发布表白";
};

loadFeed();
</script>
</body>
</html>
